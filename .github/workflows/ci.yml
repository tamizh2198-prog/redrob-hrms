name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redrob
          POSTGRES_PASSWORD: redrob_dev_password
          POSTGRES_DB: redrob_hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://redrob:redrob_dev_password@localhost:5432/redrob_hrms?schema=public
      DIRECT_URL: postgresql://redrob:redrob_dev_password@localhost:5432/redrob_hrms?schema=public
      JWT_ACCESS_SECRET: ci-test-secret
      CRON_SECRET: ci-test-secret
      PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
